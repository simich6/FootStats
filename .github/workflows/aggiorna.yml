name: Aggiorna Footstats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: footstats
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data
          key: footstats-data-${{ github.run_id }}
          restore-keys: 
footstats-data-
      - run: pip install pandas numpy scipy requests
      - name: Aggiorna dati e dashboard
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: $
{{ secrets.ODDS_API_KEY }}
        run: |
          if [ ! -f data/params.json ]; then python run.py --tune
          elif [ "$(date +%u)" = "1" ]; then python run.py --backtest
          else python run.py
          fi
          cp output/dashboard.html output/index.html
      - name: Tieni attivi gli aggiornamenti automatici
        # GitHub sospende i workflow programmati dopo 60 giorni senza attività nel repository:
        # se l'ultima modifica ha 
più di 45 giorni, registra una modifica vuota.
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*86400 )) ]; then
            git config user.name "footstats-bot"
            git config user.email "footstats-bot@users.noreply.github.com"
            git commit --allow-empty -m "Mantieni attivi gli aggiornamenti automatici"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
